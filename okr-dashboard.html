<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Irillic · OKR Program Dashboard · FY 2026-27</title>
<style>
  :root{
    --emerald:#10b981; --emerald-bg:#ecfdf5; --emerald-tx:#047857;
    --blue:#3b82f6; --blue-bg:#eff6ff; --blue-tx:#1d4ed8;
    --amber:#f59e0b; --amber-bg:#fffbeb; --amber-tx:#b45309;
    --red:#ef4444; --red-bg:#fef2f2; --red-tx:#b91c1c;
    --slate:#94a3b8; --slate-bg:#f8fafc; --slate-tx:#64748b;
    --ink:#1e293b; --line:#e2e8f0; --soft:#f1f5f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:var(--ink);font-size:14px;line-height:1.45}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .wrap{max-width:1500px;margin:0 auto;padding:0 24px}
  /* header */
  header{background:linear-gradient(100deg,#0f172a,#0f172a 55%,#1e1b4b);color:#fff}
  header .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:16px;padding-bottom:16px}
  .logo{font-size:24px;font-weight:900;letter-spacing:-.5px}
  .logo span{color:#38bdf8}
  .hmeta{border-left:1px solid rgba(255,255,255,.15);padding-left:16px}
  .hmeta b{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .hmeta p{font-size:12px;color:#94a3b8}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;font-size:12px;color:#e2e8f0}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* tabs */
  .tabbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tabbar .wrap{display:flex;align-items:center;justify-content:space-between}
  .tabs{display:flex;gap:24px;overflow-x:auto}
  .tab{appearance:none;background:none;border:none;cursor:pointer;padding:16px 2px;font-size:14px;font-weight:600;color:var(--slate);white-space:nowrap;position:relative;font-family:inherit}
  .tab:hover{color:var(--slate-tx)}
  .tab.active{color:var(--blue)}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue);border-radius:2px}
  .qlabel{font-size:12px;color:var(--slate)}
  main{padding:24px 0}
  .card{background:#fff;border-radius:16px;border:1px solid #e2e8f099;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:20px}
  .card.flush{padding:0;overflow:hidden}
  .ttl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--slate)}
  .sub{font-size:12px;color:var(--slate);margin-top:2px}
  .grid{display:grid;gap:16px}
  .stack>*+*{margin-top:24px}
  .row{display:flex;align-items:center}
  /* badges */
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:6px;display:inline-block}
  .b-completed{background:var(--emerald-bg);color:var(--emerald-tx)}
  .b-on-track{background:var(--blue-bg);color:var(--blue-tx)}
  .b-at-risk{background:var(--amber-bg);color:var(--amber-tx)}
  .b-off-track{background:var(--red-bg);color:var(--red-tx)}
  .b-pending{background:var(--slate-bg);color:var(--slate-tx)}
  .b-in-progress{background:var(--blue-bg);color:var(--blue-tx)}
  .b-blocked{background:var(--red-bg);color:var(--red-tx)}
  .b-not-started{background:var(--soft);color:var(--slate-tx)}
  .b-critical{background:var(--red-bg);color:var(--red-tx)}
  .b-high{background:var(--amber-bg);color:var(--amber-tx)}
  .b-medium{background:var(--blue-bg);color:var(--blue-tx)}
  /* progress */
  .track{flex:1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
  .track.sm{height:6px}
  .fill{height:100%;border-radius:999px}
  .f-emerald{background:var(--emerald)} .f-blue{background:var(--blue)} .f-amber{background:var(--amber)} .f-red{background:var(--red)} .f-slate{background:#cbd5e1}
  .tx-emerald{color:var(--emerald-tx)} .tx-blue{color:var(--blue-tx)} .tx-amber{color:var(--amber-tx)} .tx-red{color:var(--red-tx)} .tx-slate{color:var(--slate-tx)}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);padding:12px;border-bottom:1px solid var(--line)}
  td{padding:14px 12px;border-bottom:1px solid #f1f5f955;vertical-align:top}
  tbody tr:hover{background:#f8fafc88}
  .scroll{overflow-x:auto}
  /* exec cards */
  .stat{border-top:4px solid;display:flex;flex-direction:column;justify-content:center}
  .stat .num{font-size:40px;font-weight:900;line-height:1}
  .stat .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--slate-tx);margin-top:8px}
  .stat .s{font-size:12px;color:var(--slate);margin-top:2px}
  .gauge{position:relative;width:112px;height:112px;margin:0 auto}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .val b{font-size:30px;font-weight:900}
  .gauge .val s{font-size:9px;color:var(--slate);text-decoration:none}
  .legrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:1px 0}
  .legrow span{display:flex;align-items:center;gap:6px;color:var(--slate-tx)}
  .legrow b{color:#334155}
  /* function cards */
  .fcard{border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:16px}
  .fcode{width:36px;height:36px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--slate-tx)}
  /* deadlines */
  .dline{flex:0 0 256px;border:2px solid #fecaca;background:#fef2f230;border-radius:12px;padding:16px}
  /* timeline */
  .tl-row{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid #f1f5f955}
  .tl-name{width:190px;flex-shrink:0;padding-right:16px}
  .tl-bar{flex:1;position:relative;height:24px}
  .tl-bar .base{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:6px;background:var(--soft);border-radius:999px}
  .tl-bar .prog{position:absolute;top:50%;transform:translateY(-50%);left:0;height:6px;border-radius:999px}
  .tl-bar .today{position:absolute;top:0;bottom:0;width:1px;background:#cbd5e1}
  .tl-bar .plane{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:14px}
  .tl-pct{width:80px;flex-shrink:0;text-align:right}
  .tl-pct b{font-size:18px;font-weight:900}
  .tl-pct s{display:block;font-size:11px;font-weight:700;text-decoration:none}
  .qhead{margin-left:190px;display:grid;grid-template-columns:repeat(4,1fr);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);border-bottom:1px solid var(--line);padding-bottom:8px}
  /* trend cards */
  .tcard{border:1px solid var(--line);border-radius:12px;padding:16px}
  .tcard.red{border-color:#fecaca}
  /* filter chips */
  .chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--slate-tx);cursor:pointer;font-family:inherit}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .keyrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--slate)}
  .hidden{display:none}
  footer{padding:32px 24px;text-align:center;font-size:12px;color:var(--slate)}
  /* upload button */
  .upload{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0f172a;border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .upload:hover{background:#e2e8f0}
  .src{font-size:11px;color:#94a3b8;margin-top:4px}
  .src a{color:#7dd3fc;cursor:pointer;text-decoration:underline}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .toast.err{background:#b91c1c}
  @media (max-width:900px){.hmeta{display:none}}
  @media print{.tabbar{position:static}.tab{display:none}.tab.active{display:inline}body{background:#fff}.card{box-shadow:none;break-inside:avoid}.upload{display:none}}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

// ════════════════════ UPLOAD & REGENERATE ════════════════════
// Same rule as the audit: KRA progress = avg of its milestone tasks; function = avg of its KRAs.
const FN_DEFS=[
 {code:'RND',name:'R&D',leads:'Machaiah / Shivangi',token:'rnd'},
 {code:'PM+C',name:'Product Management + CAS',leads:'Ashwin R. / Reshma',token:'product'},
 {code:'QA',name:'QA / RA',leads:'Hariom / Nanda / Ramya',token:'qara'},
 {code:'S&M',name:'Sales & Marketing',leads:'Arindam / Amit',token:'sales'},
 {code:'MFG',name:'Manufacturing',leads:'Chandhan',token:'mfg'},
 {code:'CS',name:'Customer Service',leads:'Laxmiputra',token:'cs '},
 {code:'PUR',name:'Purchase',leads:'Harish',token:'purchase'},
 {code:'HR',name:'Human Resources',leads:'Twinkle / Rahul / Nisha',token:'hr '},
 {code:'FIN',name:'Finance',leads:'Finance Team',token:'finance'},
];
function toNum(v){if(v===null||v===undefined||v==='')return null;const n=typeof v==='number'?v:parseFloat(String(v).replace('%',''));return isNaN(n)?null:n;}
function objNum(o){if(!o)return null;const m=String(o).match(/(\d)/);return m?+m[1]:null;}
function fStatus(p){return p===0?'pending':p<10?'off-track':p<20?'at-risk':'on-track';}
function subStatus(m){return m===0?'not-submitted':m<20?'partial':'submitted';}
function extractSheet(rows){
  let kras=[],cur=null,curObj=null,mdone=0,mtot=0,blk=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]||[];
    const a=row[0],b=row[1],f=row[5],g=row[6],j=toNum(row[9]),k=row[10],reason=row[12],p=row[15];
    if(typeof a==='string'&&a.trim().toLowerCase().startsWith('obj'))curObj=a.trim();
    const isKRA=b&&typeof b==='string'&&b.trim().toUpperCase().startsWith('KRA')&&b.trim()!=='KRA Description';
    if(isKRA){cur={obj:curObj,tasks:[],rag:p};kras.push(cur);}
    if(cur&&f&&typeof f==='string'&&f.trim()!==''&&f.trim()!=='Milestone Task'&&k!=null&&String(k).trim()!==''){
      mtot++;const st=String(k).trim().toLowerCase();
      if(st==='done'||st==='completed')mdone++;
      if(j!=null)cur.tasks.push(j);
      if(st==='blocked')blk.push({task:f.trim(),owner:g,reason:reason,obj:curObj});
    }
  }
  kras.forEach(x=>x.prog=x.tasks.length?x.tasks.reduce((s,t)=>s+t,0)/x.tasks.length:0);
  const fprog=kras.length?kras.reduce((s,x)=>s+x.prog,0)/kras.length:0;
  return {fprog,kras,mdone,mtot,blk};
}
function regenerate(wb){
  const norm=n=>n.toLowerCase();
  const newFns=[],objAgg={},roll={completed:0,onTrack:0,atRisk:0,offTrack:0,pending:0},allBlk=[];
  let totalKRA=0,matched=0;
  FN_DEFS.forEach(def=>{
    const sn=wb.SheetNames.find(n=>norm(n).includes(def.token));
    if(!sn)return;matched++;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const ex=extractSheet(rows);
    newFns.push({code:def.code,name:def.name,leads:def.leads,q1:Math.round(ex.fprog*10)/10,status:fStatus(ex.fprog),mDone:ex.mdone,mTot:ex.mtot,sub:subStatus(ex.mtot),pace:ex.fprog>=10?'on-pace':'behind'});
    ex.kras.forEach(kr=>{
      totalKRA++;const rg=String(kr.rag||'').toLowerCase();
      if(rg.indexOf('green')>=0)roll.completed++;else if(rg.indexOf('amber')>=0)roll.atRisk++;else if(rg.indexOf('red')>=0)roll.offTrack++;else roll.pending++;
      const on=objNum(kr.obj);if(on){(objAgg[on]=objAgg[on]||[]).push(kr.prog);}
    });
    ex.blk.forEach(b=>{const on=objNum(b.obj);allBlk.push({fn:def.name,obj:on?'OBJ'+on:'—',task:b.task,owner:b.owner?String(b.owner):def.leads,reason:b.reason?String(b.reason):'Reason not provided'});});
  });
  if(!matched)throw new Error('no department sheets recognised — is this the Master OKR Sheet?');
  roll.total=totalKRA;
  const newObjs=objectives.map(o=>{const arr=objAgg[o.num]||[];const q=arr.length?Math.round(arr.reduce((s,x)=>s+x,0)/arr.length):0;return Object.assign({},o,{q1:q,annual:q,status:fStatus(q)});});
  const health=newFns.length?Math.round(newFns.reduce((s,f)=>s+f.q1,0)/newFns.length):0;
  const gaps=newFns.filter(f=>f.q1===0).length;
  functions=newFns;objectives=newObjs;rollup=roll;
  headline={totalKRs:totalKRA,objectives:5,healthyKRs:roll.completed,needAttention:roll.atRisk+roll.offTrack,milestoneGaps:gaps};
  meta.health=health;
  if(allBlk.length)blockers=allBlk;
}
function snapshot(){return JSON.parse(JSON.stringify({functions,objectives,rollup,headline,blockers,health:meta.health,asOf:meta.asOf}));}
function applyData(d){functions=d.functions;objectives=d.objectives;rollup=d.rollup;headline=d.headline;blockers=d.blockers;meta.health=d.health;meta.asOf=d.asOf;}
const BASELINE=snapshot();
const LS_KEY='okr_uploaded_v2';
function setSource(t,reset){$('h-src').innerHTML=esc(t)+(reset?'  ·  <a id="resetLink">reset to baseline</a>':'');const rl=$('resetLink');if(rl)rl.onclick=resetBaseline;}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>{t.className='toast'+(err?' err':'');},3800);}
function handleFile(file){
  if(typeof XLSX==='undefined'){toast('Excel reader not loaded — open online once, then it caches.',true);return;}
  const reader=new FileReader();
  reader.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    regenerate(wb);
    meta.asOf=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    const snap=snapshot();snap.fileName=file.name;
    try{localStorage.setItem(LS_KEY,JSON.stringify(snap));}catch(_){}
    renderAll();setSource('Data: '+file.name+' · regenerated '+meta.asOf,true);
    toast('✓ Dashboard regenerated from '+file.name);
  }catch(err){toast('Could not read sheet: '+err.message,true);}};
  reader.onerror=()=>toast('File read failed',true);
  reader.readAsArrayBuffer(file);
}
function resetBaseline(){applyData(JSON.parse(JSON.stringify(BASELINE)));meta.asOf=BASELINE.asOf;try{localStorage.removeItem(LS_KEY);}catch(_){}renderAll();setSource('Data: baseline (Master Sheet · '+BASELINE.asOf+')',false);toast('Reset to baseline');}

// wire upload
$('uploadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{if(e.target.files&&e.target.files[0])handleFile(e.target.files[0]);e.target.value='';};

// restore last upload if present
(function(){
  let restored=false;
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);applyData(d);setSource('Data: '+(d.fileName||'uploaded sheet')+' · '+meta.asOf,true);restored=true;}}catch(_){}
  if(!restored)setSource('Data: baseline (Master Sheet · '+BASELINE.asOf+')',false);
  renderAll();
})();
</script>
</body>
</html>
